<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Content Summarizer</title>
  <style>
    /* ---------- Base Styles ---------- */
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f2ec;
      color: #3e3e3c;
      line-height: 1.6;
    }
    header {
      background: #e6e0d6;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 2px solid #d4c8b6;
    }
    header h1 {
      font-size: 2.2em;
      margin: 0;
      color: #2f3d2c;
    }
    header p {
      font-size: 1em;
      color: #6b6b6b;
      margin-top: 10px;
    }

    /* ---------- Container ---------- */
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #c9c2b9;
      background: #fffdf9;
      margin-bottom: 16px;
      resize: vertical;
      transition: 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #8b9c85;
      box-shadow: 0 0 6px rgba(139,156,133,0.3);
    }

    button {
      display: inline-block;
      padding: 12px 28px;
      font-size: 16px;
      background: #8b9c85;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #6f806b;
      transform: scale(1.03);
    }

    h2 {
      margin-top: 40px;
      color: #2f3d2c;
    }

    #summary {
      background: #fff;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.08);
      min-height: 60px;
      white-space: pre-wrap;
      font-size: 1.05em;
      color: #3d3c38;
      border-left: 6px solid #8b9c85;
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      background: #e6e0d6;
      text-align: center;
      font-size: 0.9em;
      color: #6b6b6b;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 AI Content Summarizer</h1>
    <p>Developed for 2nd task</p>
  </header>

  <div class="container">
    <textarea id="inputText" rows="10" placeholder="Paste your article here..."></textarea><br>
    <button onclick="summarize()">Summarize</button>

    <h2>Summary:</h2>
    <div id="summary">Your summary will appear here.</div>
  </div>

  <footer>
    <p>Developed by Jeeva G Email: gjeeva181@gmail.com</p>
  </footer>

  <script>
    async function summarize() {
      const text = document.getElementById("inputText").value;
      const summaryDiv = document.getElementById("summary");

      if (!text.trim()) {
        summaryDiv.innerText = "⚠️ Please enter some text to summarize.";
        return;
      }

      summaryDiv.innerText = "Summarizing... ⏳";

      try {
        const response = await fetch("/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await response.json();

        if (response.ok) {
          summaryDiv.innerHTML = `<p>${data.summary}</p><p><em>Generated by: ${data.provider}</em></p>`;
        } else {
          summaryDiv.innerText = data.error || "An error occurred.";
        }
      } catch (error) {
        summaryDiv.innerText = "❌ Failed to connect to backend. Is Flask running?";
        console.error("Error:", error);
      }
    }
  </script>
</body>
</html>
